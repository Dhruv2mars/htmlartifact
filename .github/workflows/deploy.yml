name: Deploy
# main -> production (htmlartifact.pages.dev), staging -> staging.htmlartifact.pages.dev.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit, Workers Scripts:Edit, D1:Edit) and
# CLOUDFLARE_ACCOUNT_ID. Skips cleanly when they are not set.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run typecheck && bun run test
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run deploy:all -- --branch "$BRANCH"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run smoke -- "$([ "$BRANCH" = main ] && echo https://htmlartifact.pages.dev || echo https://staging.htmlartifact.pages.dev)"
