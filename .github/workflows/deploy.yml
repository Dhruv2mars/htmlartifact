name: Deploy
# main -> production (htmlartifact.pages.dev), staging -> staging.htmlartifact.pages.dev.
# Runs once CI has passed on the pushed commit and deploys exactly that commit:
# CI runs the full suite (D1 and R2), so it is not run again here (re-running
# it doubled the wait and its local-SQLite flakes cancelled deploys).
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit, Workers Scripts:Edit, D1:Edit) and
# CLOUDFLARE_ACCOUNT_ID. Skips cleanly when they are not set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    # A push to main or staging whose CI passed, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: env.HAS_TOKEN == 'true'
        uses: oven-sh/setup-bun@v2
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: env.HAS_TOKEN == 'true'
        run: bun install --frozen-lockfile
      - if: env.HAS_TOKEN == 'true'
        run: bun run typecheck
      # The Cloudflare credentials are visible to these two steps only.
      - if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:all -- --branch "$BRANCH"
      - if: env.HAS_TOKEN == 'true'
        run: bun run smoke -- "$([ "$BRANCH" = main ] && echo https://htmlartifact.pages.dev || echo https://staging.htmlartifact.pages.dev)"
