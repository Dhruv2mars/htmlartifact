name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:cli
      - run: bun run typecheck:web
      - run: bun run lint
      - run: bun scripts/changelog.ts check
      - run: bun run test

  # The published CLI on every supported platform and the oldest supported
  # Node (package.json engines): it starts, and validates a site offline.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.10", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run the CLI
        env:
          HTMLARTIFACT_HOME: ${{ runner.temp }}/htmlartifact
        run: |
          node dist/htmlartifact.js --version | grep -Fx "$(node -p 'require("./package.json").version')"
          node dist/htmlartifact.js --help | grep -q upload
          mkdir -p site/docs
          printf '<!doctype html><title>Home</title><a href="docs/notes.html">notes</a>' > site/index.html
          printf '<!doctype html><title>Notes</title><p>notes</p>' > site/docs/notes.html
          node dist/htmlartifact.js check site | tee check.txt
          grep -q "2 pages" check.txt
