name: CI

# GitHub is a one-way mirror of the Entire repo (git mirror); this runs on every mirrored push. report.yml reports
# each run to the Entire trail, whose merge gate requires it.
# The merge gate `bun run check` in 7 parallel jobs: the static steps, and each storage's suite in 3 shards.
on:
  push:
    branches-ignore: ['archive/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.shard && format('{0} {1}', matrix.part, matrix.shard) || matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: static
          - { part: d1, shard: '1/3' }
          - { part: d1, shard: '2/3' }
          - { part: d1, shard: '3/3' }
          - { part: r2, shard: '1/3' }
          - { part: r2, shard: '2/3' }
          - { part: r2, shard: '3/3' }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HTMLARTIFACT_HOME: ${{ github.workspace }}/../htmlartifact-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun run check -- --part ${{ matrix.part }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
