name: Release
# Publishes the CLI to npm with provenance when a v* tag is pushed. Uses npm
# trusted publishing (OIDC): enable it once on npmjs.com for this repo and
# workflow (Package settings -> Trusted publishers).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:cli && bun run test
      - run: bun run build
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
