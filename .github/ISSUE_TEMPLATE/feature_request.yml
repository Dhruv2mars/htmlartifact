name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. CLI examples help.
    validations:
      required: true
  - type: checkboxes
    id: free
    attributes:
      label: Free tiers
      description: htmlartifact runs only on free tiers (CONTRIBUTING.md → Ground rules).
      options:
        - label: This works without any paid plan or service, as far as I know.
