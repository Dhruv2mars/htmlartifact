# Buildkite CI (replaces .github/workflows now that this repo lives on Entire).
# Runs on the free hosted linux-small queue; checkout comes from the Entire plugin Buildkite adds to every job.
# One job, the same command as the local merge gate (CONTRIBUTING.md → The merge gate).
steps:
  - label: ":bun: bun run check"
    key: check
    timeout_in_minutes: 30
    agents: { queue: linux-small }
    plugins:
      - docker#v5.12.0:
          image: node:24
          environment: [HTMLARTIFACT_HOME=/tmp/htmlartifact]
    command: |
      npm i -g --silent bun@1.3.13
      bun run check
