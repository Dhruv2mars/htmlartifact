# Buildkite CI (replaces .github/workflows now that this repo lives on Entire).
# Runs on the free hosted linux-small queue; checkout comes from the Entire plugin Buildkite adds to every job.
# The merge gate (CONTRIBUTING.md → The merge gate), split so its parts run side by side:
# the static steps, and each storage's suite in 3 shards (node --test-shard).
# 7 jobs x 2 vCPU fit the Free plan's 20-vCPU concurrency; the suites took ~15 min in one job.
steps:
  - label: ":bun: check (static)"
    key: check
    timeout_in_minutes: 20
    agents: { queue: linux-small }
    plugins:
      - docker#v5.12.0:
          image: node:24
          environment: [HTMLARTIFACT_HOME=/tmp/htmlartifact, BUILDKITE_PARALLEL_JOB, BUILDKITE_PARALLEL_JOB_COUNT]
    command: |
      npm i -g --silent bun@1.3.13
      bun run check -- --part static
  - label: ":bun: check (D1 suite)"
    key: check-d1
    parallelism: 3
    timeout_in_minutes: 20
    agents: { queue: linux-small }
    plugins:
      - docker#v5.12.0:
          image: node:24
          environment: [HTMLARTIFACT_HOME=/tmp/htmlartifact, BUILDKITE_PARALLEL_JOB, BUILDKITE_PARALLEL_JOB_COUNT]
    command: |
      npm i -g --silent bun@1.3.13
      bun run check -- --part d1
  - label: ":bun: check (R2 suite)"
    key: check-r2
    parallelism: 3
    timeout_in_minutes: 20
    agents: { queue: linux-small }
    plugins:
      - docker#v5.12.0:
          image: node:24
          environment: [HTMLARTIFACT_HOME=/tmp/htmlartifact, BUILDKITE_PARALLEL_JOB, BUILDKITE_PARALLEL_JOB_COUNT]
    command: |
      npm i -g --silent bun@1.3.13
      bun run check -- --part r2
