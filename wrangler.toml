# Local development and tests only (bun run dev:local, bun run test).
# Production deploys from deploy/app, deploy/usercontent and deploy/ops
# (bun run deploy:all) and stores artifact HTML in D1, never R2. The R2 binding
# below is local-only: the test suite runs once with it (HTMLARTIFACT_TEST_STORAGE=r2)
# and once without it (d1).
name = "htmlartifact"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "htmlartifact"
database_id = "00000000-0000-0000-0000-000000000000" # set after: wrangler d1 create htmlartifact

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "htmlartifact-artifacts"

# The web app's static assets (bun run build:web). Pages deploys copy them
# next to _worker.js (scripts/build-pages.ts). Worker first, so only the app
# host serves them (src/frontend.ts); the sandbox host never does.
[assets]
directory = "web/build/client"
binding = "ASSETS"
run_worker_first = true
