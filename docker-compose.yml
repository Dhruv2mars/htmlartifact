services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: htmlartifact
      POSTGRES_PASSWORD: htmlartifact
      POSTGRES_DB: htmlartifact
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "htmlartifact"]
      interval: 5s
volumes:
  artifacts:
  pgdata:
