# Pages project "htmlartifact-usercontent" -> https://htmlartifact-usercontent.pages.dev
# The sandbox origin: serves artifact HTML only, to capability URLs minted by the app.
# Same bundle as the app; requests are routed by host.
# Deploy: bun run build:pages && (cd deploy/usercontent && bunx wrangler pages deploy --no-bundle --branch=main)
# Secrets (bunx wrangler pages secret put NAME --project-name=htmlartifact-usercontent):
#   Same values as the app (the cookie password signs sandbox capabilities)
name = "htmlartifact-usercontent"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
HTMLARTIFACT_PUBLIC_BASE_URL = "https://htmlartifact.pages.dev"
HTMLARTIFACT_SANDBOX_ORIGIN = "https://htmlartifact-usercontent.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "htmlartifact"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "htmlartifact-artifacts"

[[services]]
binding = "OPS"
service = "htmlartifact-ops"
entrypoint = "Ops"

# Staging: preview deployments (branch "staging" -> https://staging.htmlartifact.pages.dev)
[env.preview.vars]
HTMLARTIFACT_PUBLIC_BASE_URL = "https://staging.htmlartifact.pages.dev"
HTMLARTIFACT_SANDBOX_ORIGIN = "https://staging.htmlartifact-usercontent.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "htmlartifact-staging"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.preview.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "htmlartifact-artifacts-staging"

[[env.preview.services]]
binding = "OPS"
service = "htmlartifact-ops-staging"
entrypoint = "Ops"
